<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediLink - Registro</title>
  <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>
<body>

  <div class="card shadow-lg p-5">
    <h2 class="text-center text-primary mb-4 fw-bold">Crear Cuenta</h2>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="mb-3">
        <label class="form-label fw-semibold">Nombre completo</label>
        <input type="text" class="form-control" th:field="*{nombre}" placeholder="Juan Pérez" required>
        <div class="text-danger" th:errors="*{nombre}" th:if="${#fields.hasErrors('nombre')}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">DNI (8 dígitos)</label>
        <input type="text" class="form-control" th:field="*{dni}" placeholder="77777777" required>
        <div class="text-danger" th:errors="*{dni}" th:if="${#fields.hasErrors('dni')}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Teléfono (9 dígitos)</label>
        <input type="text" class="form-control" th:field="*{telefono}" placeholder="987654321" required>
        <div class="text-danger" th:errors="*{telefono}" th:if="${#fields.hasErrors('telefono')}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Correo electrónico</label>
        <input type="email" class="form-control" th:field="*{email}" placeholder="correo@ejemplo.com" required>
        <div class="text-danger" th:errors="*{email}" th:if="${#fields.hasErrors('email')}"></div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Contraseña</label>
        <input type="password" class="form-control" th:field="*{password}" placeholder="********" required>
        <div class="text-danger" th:errors="*{password}" th:if="${#fields.hasErrors('password')}"></div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Registrarse</button>
    </form>

    <p class="text-center mt-4 mb-0">
      ¿Ya tienes cuenta?
      <a th:href="@{/login}" class="text-decoration-none fw-semibold">Inicia sesión aquí</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
