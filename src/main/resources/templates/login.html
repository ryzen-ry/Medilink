<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediLink - Iniciar Sesión</title>
  <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

  <div class="card shadow-lg p-5">
    <h2 class="text-center text-primary mb-4 fw-bold">Iniciar Sesión</h2>

    <form th:action="@{/procesar-login}" th:object="${loginDTO}" method="post">
      <!-- ✅ CSRF: Thymeleaf lo agrega automáticamente por usar th:action -->
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Correo electrónico</label>
        <input id="email" class="form-control" type="email" th:field="*{email}" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Contraseña</label>
        <input id="password" class="form-control" type="password" th:field="*{password}" placeholder="********" required>
      </div>

      <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Ingresar</button>
    </form>

    <p class="text-center mt-4 mb-0">
      ¿No tienes cuenta?
      <a th:href="@{/registro}" class="text-decoration-none fw-semibold">Regístrate aquí</a>
    </p>

    <div th:if="${param.error}" class="alert alert-danger text-center mt-3 py-2 small" role="alert">
      Credenciales incorrectas, intenta nuevamente.
    </div>

    <div th:if="${param.logout}" class="alert alert-success text-center mt-3 py-2 small" role="alert">
      Has cerrado sesión correctamente.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous">
  </script>
</body>
</html>
