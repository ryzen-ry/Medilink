spring.application.name=medilink
spring.jpa.database=mysql
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ✅ Railway inyecta: MYSQL_URL (ej: mysql://user:pass@host:port/db)
# ✅ Se antepone jdbc: para formar la URL JDBC completa
spring.datasource.url=jdbc:${MYSQL_URL:mysql://localhost:3306/prueba?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# ✅ Railway inyecta: MYSQLUSER (sin guión bajo)
spring.datasource.username=${MYSQLUSER:root}

# ✅ Railway inyecta: MYSQL_ROOT_PASSWORD
spring.datasource.password=${MYSQL_ROOT_PASSWORD:12345678}

# ✅ Railway asigna el puerto automáticamente con la variable PORT
server.port=${PORT:8080}
ADPASS=admin123
