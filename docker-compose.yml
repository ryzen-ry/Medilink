version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: medilink-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: prueba
    ports:
      - "3307:3306"  
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    image: medilink-app:latest
    container_name: medilink-app
    ports:
      - "8080:8080"
    environment:
      # ✅ AHORA USA MYSQL_URL (sin jdbc:)
      MYSQL_URL: mysql://mysql:3306/prueba?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: 12345678
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
